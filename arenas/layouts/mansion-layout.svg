<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 980" width="780" height="980" font-family="Helvetica, Arial, sans-serif">
  <title>Old Mansion floor plan, top-down. 1 grid square = 1 m. Front (camera side) is the bottom.</title>
  <desc>Origin (0,0) is the back-left corner of the house at floor level. x grows to the right, depth grows toward the front (truck). In Godot: plan x = X, plan depth = Z, Y is up. Scale: 30 px = 1 m, offset 60 px.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#e4e2dc" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5f5e5a"/>
    </marker>
  </defs>

  <rect width="780" height="980" fill="#ffffff"/>
  <rect x="60" y="60" width="600" height="780" fill="url(#grid)"/>

  <text x="60" y="34" font-size="17" font-weight="bold" fill="#2c2c2a">Old Mansion — floor plan v1 (from sketch)</text>
  <text x="60" y="52" font-size="11.5" fill="#5f5e5a">Top-down · 1 square = 1 m · front (camera side) at the bottom · origin = back-left corner</text>

  <g id="room-first-floor" data-x="0" data-z="0" data-w="20" data-d="6">
    <rect x="60" y="60" width="600" height="180" fill="#EEEDFE" fill-opacity="0.7"/>
    <text x="360" y="140" font-size="15" font-weight="bold" fill="#3C3489" text-anchor="middle">1st floor (raised gallery)</text>
    <text x="360" y="158" font-size="11.5" fill="#534AB7" text-anchor="middle">20 × 6 m · floor 1.2 m up · railing along its front edge</text>
  </g>

  <g id="room-main" data-x="0" data-z="6" data-w="12" data-d="9">
    <rect x="60" y="240" width="360" height="270" fill="#FAEEDA" fill-opacity="0.7"/>
    <text x="285" y="400" font-size="15" font-weight="bold" fill="#633806" text-anchor="middle">Main room</text>
    <text x="285" y="418" font-size="11.5" fill="#854F0B" text-anchor="middle">12 × 9 m</text>
  </g>

  <g id="area-stairs" data-x="0" data-z="6" data-w="3" data-d="4">
    <rect x="60" y="240" width="90" height="120" fill="#F1EFE8"/>
    <g stroke="#888780" stroke-width="1">
      <line x1="60" y1="255" x2="150" y2="255"/><line x1="60" y1="270" x2="150" y2="270"/>
      <line x1="60" y1="285" x2="150" y2="285"/><line x1="60" y1="300" x2="150" y2="300"/>
      <line x1="60" y1="315" x2="150" y2="315"/><line x1="60" y1="330" x2="150" y2="330"/>
      <line x1="60" y1="345" x2="150" y2="345"/>
    </g>
    <line x1="105" y1="352" x2="105" y2="250" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="64" y="288" width="82" height="30" rx="4" fill="#ffffff" fill-opacity="0.9"/>
    <text x="105" y="301" font-size="11.5" font-weight="bold" fill="#2c2c2a" text-anchor="middle">Stairs up</text>
    <text x="105" y="314" font-size="10.5" fill="#5f5e5a" text-anchor="middle">1.2 m rise</text>
    <text x="105" y="376" font-size="10.5" fill="#5f5e5a" text-anchor="middle">entry ↑</text>
  </g>

  <g id="room-kitchen" data-x="12" data-z="6" data-w="8" data-d="9">
    <rect x="420" y="240" width="240" height="270" fill="#E1F5EE" fill-opacity="0.8"/>
    <text x="540" y="370" font-size="15" font-weight="bold" fill="#085041" text-anchor="middle">Kitchen</text>
    <text x="540" y="388" font-size="11.5" fill="#0F6E56" text-anchor="middle">8 × 9 m</text>
  </g>

  <g id="room-garden" data-x="10" data-z="15" data-w="10" data-d="7">
    <rect x="360" y="510" width="300" height="210" fill="#EAF3DE" fill-opacity="0.9"/>
    <text x="520" y="610" font-size="15" font-weight="bold" fill="#27500A" text-anchor="middle">Garden</text>
    <text x="520" y="628" font-size="11.5" fill="#3B6D11" text-anchor="middle">10 × 7 m · low fence</text>
  </g>

  <g id="path-driveway" data-x="6.5" data-z="15" data-w="2.5" data-d="7.5">
    <rect x="255" y="510" width="75" height="225" fill="#F1EFE8"/>
    <line x1="255" y1="512" x2="255" y2="735" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
    <line x1="330" y1="512" x2="330" y2="735" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="292" y="620" font-size="11.5" fill="#5f5e5a" text-anchor="middle" transform="rotate(-90 292 620)">Path 2.5 m wide</text>
  </g>

  <g id="walls" stroke="#2c2c2a" stroke-width="5" stroke-linecap="square" fill="none">
    <line x1="60" y1="60" x2="660" y2="60"/>
    <line x1="60" y1="60" x2="60" y2="510"/>
    <line x1="660" y1="60" x2="660" y2="510"/>
    <line x1="60" y1="510" x2="255" y2="510"/>
    <line x1="330" y1="510" x2="660" y2="510"/>
    <line x1="420" y1="240" x2="420" y2="360"/>
    <line x1="420" y1="420" x2="420" y2="510"/>
  </g>
  <g id="railings" stroke="#534AB7" stroke-width="3" fill="none" stroke-dasharray="2 4" stroke-linecap="round">
    <line id="railing-gallery-edge" x1="150" y1="240" x2="660" y2="240"/>
    <line id="railing-stairs-side" x1="150" y1="240" x2="150" y2="360"/>
  </g>

  <g id="fence" stroke="#639922" stroke-width="3" fill="none">
    <line x1="360" y1="512" x2="360" y2="525"/>
    <line x1="360" y1="585" x2="360" y2="720"/>
    <line x1="360" y1="720" x2="660" y2="720"/>
    <line x1="660" y1="510" x2="660" y2="720"/>
  </g>

  <g id="doors">
    <g id="door-front" data-x="6.5" data-z="15" data-width="2.5">
      <line x1="255" y1="510" x2="330" y2="510" stroke="#D85A30" stroke-width="6"/>
      <text x="292" y="502" font-size="11" font-weight="bold" fill="#993C1D" text-anchor="middle">Front door 2.5 m</text>
    </g>
    <g id="door-kitchen" data-x="12" data-z="10" data-width="2">
      <line x1="420" y1="360" x2="420" y2="420" stroke="#D85A30" stroke-width="6"/>
      <text x="428" y="352" font-size="11" font-weight="bold" fill="#993C1D">Kitchen door 2 m</text>
    </g>
    <g id="gate-garden" data-x="10" data-z="15.5" data-width="2">
      <line x1="360" y1="525" x2="360" y2="585" stroke="#D85A30" stroke-width="6"/>
      <text x="370" y="560" font-size="11" font-weight="bold" fill="#993C1D">Garden gate 2 m</text>
    </g>
  </g>

  <g id="truck" data-x="6" data-z="23" data-w="6.5" data-d="3">
    <rect x="240" y="750" width="150" height="90" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.5"/>
    <rect x="390" y="760" width="45" height="70" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="2.5"/>
    <rect id="truck-zone" x="248" y="756" width="134" height="78" rx="3" fill="#C0DD97" fill-opacity="0.45" stroke="#3B6D11" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="315" y="792" font-size="14" font-weight="bold" fill="#0C447C" text-anchor="middle">Truck</text>
    <text x="315" y="809" font-size="11" fill="#3B6D11" text-anchor="middle">truck zone (bed)</text>
    <text x="412" y="799" font-size="10.5" fill="#0C447C" text-anchor="middle">cab</text>
    <circle cx="265" cy="750" r="6" fill="#ffffff" stroke="#185FA5" stroke-width="2"/>
    <circle cx="365" cy="750" r="6" fill="#ffffff" stroke="#185FA5" stroke-width="2"/>
    <circle cx="265" cy="840" r="6" fill="#ffffff" stroke="#185FA5" stroke-width="2"/>
    <circle cx="365" cy="840" r="6" fill="#ffffff" stroke="#185FA5" stroke-width="2"/>
  </g>

  <g id="dimensions" font-size="11" fill="#5f5e5a">
    <line x1="60" y1="70" x2="660" y2="70" stroke="#888780" stroke-width="0" />
    <line x1="682" y1="60" x2="682" y2="240" stroke="#888780" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="690" y="154">6 m</text>
    <line x1="682" y1="240" x2="682" y2="510" stroke="#888780" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="690" y="379">9 m</text>
    <line x1="682" y1="510" x2="682" y2="720" stroke="#888780" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="690" y="619">7 m</text>
    <text x="690" y="790">truck</text>
    <text x="690" y="804">z 23–26</text>
  </g>

  <g id="camera">
    <circle cx="96" cy="818" r="12" fill="#2c2c2a"/>
    <rect x="88" y="812" width="16" height="12" rx="2" fill="#ffffff"/>
    <line x1="104" y1="804" x2="180" y2="590" stroke="#2c2c2a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="60" y="868" font-size="11" fill="#2c2c2a">Camera: front-left, 55° down, ~20° yaw</text>
  </g>

  <g id="legend" font-size="11" fill="#2c2c2a">
    <line x1="60" y1="900" x2="210" y2="900" stroke="#2c2c2a" stroke-width="2"/>
    <line x1="60" y1="894" x2="60" y2="906" stroke="#2c2c2a" stroke-width="2"/>
    <line x1="210" y1="894" x2="210" y2="906" stroke="#2c2c2a" stroke-width="2"/>
    <text x="60" y="922">0</text><text x="203" y="922">5 m</text>
    <line x1="260" y1="900" x2="290" y2="900" stroke="#2c2c2a" stroke-width="5"/>
    <text x="298" y="904">wall</text>
    <line x1="340" y1="900" x2="370" y2="900" stroke="#639922" stroke-width="3"/>
    <text x="378" y="904">low fence</text>
    <line x1="450" y1="900" x2="480" y2="900" stroke="#D85A30" stroke-width="6"/>
    <text x="488" y="904">doorway</text>
    <line x1="550" y1="900" x2="580" y2="900" stroke="#534AB7" stroke-width="3" stroke-dasharray="2 4" stroke-linecap="round"/>
    <text x="588" y="904">railing (1 m)</text>
    <text x="60" y="950" font-size="10.5" fill="#5f5e5a">Sizes are a first pass scaled from the sketch. Element ids and data-x / data-z / data-w / data-d (metres) are for the build agent.</text>
  </g>
</svg>
