<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" font-family="Helvetica, Arial, sans-serif">
<title>Ghost Ship proposed deck plan v1</title><desc>One grid square is one metre, 30 pixels. Origin at the aft port corner. X increases toward the bow at right; Z increases toward the tug at bottom; Y is height. Proposed dimensions, not implemented.</desc>
<defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#cddae1" stroke-width="1" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b16913" /></marker></defs>
