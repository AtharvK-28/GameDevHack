<text x="480" y="447.0" text-anchor="middle" fill="#343449" font-size="11" font-weight="normal">clear</text>
<text x="624.0" y="426.0" text-anchor="middle" fill="#a85032" font-size="12" font-weight="bold">3.6 m crossing</text>
<text x="624.0" y="444.0" text-anchor="middle" fill="#a85032" font-size="12" font-weight="normal">NO RAILINGS</text>
<text x="480" y="558.0" text-anchor="middle" fill="#343449" font-size="12" font-weight="bold">DELIVER ON TUG</text>
<text x="480" y="576.0" text-anchor="middle" fill="#343449" font-size="12" font-weight="normal">Release GRAB</text>
