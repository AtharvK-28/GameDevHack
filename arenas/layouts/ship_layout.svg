<text x="930" y="110" font-size="13" font-weight="bold" fill="#343449">THE PLAY ROUTE</text>
<text x="930" y="133" font-size="12" fill="#5b6570">Chest begins in the open hold.</text>
<text x="930" y="150" font-size="12" fill="#5b6570">Carry up the wide ramp, turn</text>
<text x="930" y="167" font-size="12" fill="#5b6570">on the main deck, then cross</text>
<text x="930" y="184" font-size="12" fill="#5b6570">lengthwise: one mover ahead,</text>
<text x="930" y="201" font-size="12" fill="#5b6570">one behind. No side-by-side</text>
<text x="930" y="218" font-size="12" fill="#5b6570">squeeze is required.</text>
<text x="930" y="262" font-size="13" font-weight="bold" fill="#343449">HEIGHTS / EDGES</text>
<text x="930" y="285" font-size="12" fill="#5b6570">Deck 0 m; water −2.4 m.</text>
<text x="930" y="302" font-size="12" fill="#5b6570">Hold −1.2 m; aft +1.2 m;</text>
<text x="930" y="319" font-size="12" fill="#5b6570">bow +0.8 m. Ramps are solid.</text>
<text x="930" y="336" font-size="12" fill="#5b6570">Front bulwarks: 0.7 m high.</text>
<text x="930" y="353" font-size="12" fill="#5b6570">Gangplank edges stay open.</text>
<text x="930" y="397" font-size="13" font-weight="bold" fill="#343449">FIVE PROGRESS ZONES</text>
<text x="930" y="420" font-size="12" fill="#5b6570">Quarterdeck / Main deck /</text>
<text x="930" y="437" font-size="12" fill="#5b6570">Cargo hold / Forecastle / Tug.</text>
<text x="930" y="454" font-size="12" fill="#5b6570">The hold is its own room;</text>
<text x="930" y="471" font-size="12" fill="#5b6570">zones resolve by floor height.</text>
<text x="930" y="515" font-size="13" font-weight="bold" fill="#343449">CAMERA / READABILITY</text>
<text x="930" y="538" font-size="12" fill="#5b6570">55° pitch; Ship yaw −20°.</text>
<text x="930" y="555" font-size="12" fill="#5b6570">Follow distance 12–26 m.</text>
<text x="930" y="572" font-size="12" fill="#5b6570">Masts and sails stay behind</text>
<text x="930" y="589" font-size="12" fill="#5b6570">play or fade when obstructing.</text>
<text x="930" y="606" font-size="12" fill="#5b6570">No green environmental glow.</text>
<text x="930" y="650" font-size="13" font-weight="bold" fill="#343449">LEGEND</text>
<text x="930" y="673" font-size="12" fill="#5b6570">Gold circles: loot spawn spots.</text>
<text x="930" y="690" font-size="12" fill="#5b6570">Purple squares: hauntable props.</text>
<text x="930" y="707" font-size="12" fill="#5b6570">Dashed amber: chest route.</text>
<text x="930" y="724" font-size="12" fill="#5b6570">Grey hull: visual shell only.</text>
<text x="930" y="741" font-size="12" fill="#5b6570">All geometry is proposed.</text>
<path d="M60 750H210 M60 744V756 M210 744V756" stroke="#343449" stroke-width="2" />
<text x="135" y="775" text-anchor="middle" font-size="12" fill="#343449">5 metres</text>
<text x="270" y="752" font-size="13" fill="#343449">Loot tags: S ≤ 0.6 × 0.6 m · M ≤ 1 × 1 m · XL chest 2 × 1.2 m</text>
<text x="270" y="775" font-size="12" fill="#5b6570">Turning pads are clear of spawns and decorations. Exact collision clearances will be tested in Godot.</text>
<text x="60" y="828" font-size="13" fill="#343449">Proposed mover overboard rule: release item on falling in → 2 s rescue → return to a clear tug spawn.</text>
<text x="60" y="851" font-size="12" fill="#5b6570">World physics stays still. Only sails, ropes, distant creatures and cosmetic hull accents animate.</text>
</svg>