<text x="765.0" y="198" text-anchor="middle" fill="#343449" font-size="14" font-weight="normal">5 × 10 m</text>
<text x="765.0" y="216" text-anchor="middle" fill="#343449" font-size="14" font-weight="normal">floor +0.8 m</text>
<text x="405" y="159.0" text-anchor="middle" fill="#343449" font-size="12" font-weight="bold">OPEN CARGO HOLD</text>
<text x="405" y="177.0" text-anchor="middle" fill="#343449" font-size="12" font-weight="normal">5 × 4 m</text>
<text x="405" y="195.0" text-anchor="middle" fill="#343449" font-size="12" font-weight="normal">floor −1.2 m; no roof</text>
<text x="525" y="165.0" text-anchor="middle" fill="#343449" font-size="12" font-weight="bold">RAMP →</text>
<text x="525" y="183.0" text-anchor="middle" fill="#343449" font-size="12" font-weight="normal">3 m run</text>
<text x="525" y="201.0" text-anchor="middle" fill="#343449" font-size="12" font-weight="normal">4 m wide</text>
<text x="270" y="333.0" text-anchor="middle" fill="#343449" font-size="12" font-weight="bold">← UP</text>
<text x="270" y="351.0" text-anchor="middle" fill="#343449" font-size="12" font-weight="normal">3 m wide</text>
<text x="630" y="333.0" text-anchor="middle" fill="#343449" font-size="12" font-weight="bold">UP →</text>
<text x="630" y="351.0" text-anchor="middle" fill="#343449" font-size="12" font-weight="normal">3 m wide</text>
<text x="450" y="110" text-anchor="middle" fill="#343449" font-size="13" font-weight="bold">MAIN DECK · floor 0</text>
<text x="480" y="300.0" text-anchor="middle" fill="#343449" font-size="11" font-weight="bold">TURN</text>
<text x="480" y="318.0" text-anchor="middle" fill="#343449" font-size="11" font-weight="normal">4 × 4 m</text>
